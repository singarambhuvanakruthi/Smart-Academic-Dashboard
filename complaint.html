<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint & Request Box</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/complaint.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-logo">
                        <i class="ri-graduation-cap-line"></i>
                    </div>
                    <div class="brand-text">Smart Academic</div>
                </div>

                <div class="profile-card">
                    <div class="profile-avatar">
                        <i class="ri-user-3-line"></i>
                        <span class="status-dot"></span>
                    </div>
                    <h2 id="sidebarUserName">S. Bhuvana Kruthi</h2>
                    <p id="sidebarUserCourse">B.Tech 2nd Year - 2nd Semester</p>
                    <p id="sidebarUserBranch">CSE - A</p>
                </div>

                <nav class="sidebar-menu">
                    <a href="student-dashboard.html" class="menu-item">
                        <i class="ri-dashboard-line"></i>
                        <span>Dashboard</span>
                    </a>

                    <a href="feedback.html" class="menu-item">
                        <i class="ri-chat-1-line"></i>
                        <span>Classroom Feedback</span>
                    </a>

                    <a href="assignment.html" class="menu-item">
                        <i class="ri-task-line"></i>
                        <span>Assignment Tracker</span>
                    </a>

                    <a href="complaint.html" class="menu-item active">
                        <i class="ri-error-warning-line"></i>
                        <span>Complaint & Request Box</span>
                    </a>
                </nav>
            </div>

            <div class="logout-wrap">
                <button id="logoutBtn" class="logout-btn">
                    <i class="ri-logout-box-r-line"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Complaint & Request Box</h1>

                <div class="topbar-right">
                    <div class="search-box">
                        <i class="ri-search-line"></i>
                        <input type="text" id="searchInput" placeholder="Search...">
                    </div>

                    <button class="icon-btn">
                        <i class="ri-notification-3-line"></i>
                        <span class="notif-badge">3</span>
                    </button>

                    <div class="top-user">
                        <div class="top-user-icon">
                            <i class="ri-user-line"></i>
                        </div>
                        <span id="topUserName">Bhuvana</span>
                    </div>
                </div>
            </header>

            <section class="page-body">
                <div class="two-column-grid">
                    <div class="form-card">
                        <h2>Submit a Complaint</h2>

                        <div class="field">
                            <label>ISSUE TITLE</label>
                            <input type="text" id="issueTitle" placeholder="e.g. Projector not working in Room 204">
                        </div>

                        <div class="field">
                            <label>DESCRIPTION</label>
                            <textarea id="issueDescription" placeholder="Describe the issue in detail..."></textarea>
                        </div>

                        <button id="submitComplaintBtn" class="submit-btn blue-btn">Submit Complaint</button>
                        <p id="complaintMessage" class="message"></p>
                    </div>

                    <div class="form-card">
                        <h2>Leave Request</h2>

                        <div class="field">
                            <label>REASON FOR LEAVE</label>
                            <input type="text" id="leaveReason" placeholder="Medical Appointment">
                        </div>

                        <div class="field">
                            <label>DATE</label>
                            <input type="date" id="leaveDate">
                        </div>

                        <button id="submitLeaveBtn" class="submit-btn purple-btn">Submit Leave Request</button>
                        <p id="leaveMessage" class="message"></p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/complaint.js"></script>
</body>
</html>
