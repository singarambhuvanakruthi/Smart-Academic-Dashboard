<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Assignment Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/teacher-assignment.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-logo">
                        <i class="ri-graduation-cap-line"></i>
                    </div>
                    <div class="brand-text">Smart Academic</div>
                </div>

                <div class="profile-card">
                    <div class="profile-avatar">
                        <i class="ri-user-3-line"></i>
                        <span class="status-dot"></span>
                    </div>
                    <h2 id="sidebarUserName">Mohammed Arshad Hussain</h2>
                    <p id="sidebarUserRole">Assistant Professor</p>
                    <p id="sidebarUserDept">Department of Computer Science Engineering | Operating Systems Faculty</p>
                </div>

                <nav class="sidebar-menu">
                    <a href="teacher-dashboard.html" class="menu-item">
                        <i class="ri-dashboard-line"></i>
                        <span>Dashboard</span>
                    </a>

                    <a href="teacher-feedback.html" class="menu-item">
                        <i class="ri-chat-1-line"></i>
                        <span>Classroom Feedback</span>
                    </a>

                    <a href="teacher-assignment.html" class="menu-item active">
                        <i class="ri-task-line"></i>
                        <span>Assignment Tracker</span>
                    </a>

                    <a href="teacher-requests.html" class="menu-item">
                        <i class="ri-notification-3-line"></i>
                        <span>Complaint & Request Box</span>
                    </a>
                </nav>
            </div>

            <div class="logout-wrap">
                <button id="logoutBtn" class="logout-btn">
                    <i class="ri-logout-box-r-line"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Assignment Tracker</h1>

                <div class="topbar-right">
                    <div class="search-box">
                        <i class="ri-search-line"></i>
                        <input type="text" id="searchInput" placeholder="Search...">
                    </div>

                    <button class="icon-btn">
                        <i class="ri-notification-3-line"></i>
                        <span class="notif-badge">0</span>
                    </button>

                    <div class="top-user">
                        <div class="top-user-icon">
                            <i class="ri-user-line"></i>
                        </div>
                        <span id="topUserName">Arshad Sir</span>
                    </div>
                </div>
            </header>

            <section class="page-body">
                <div class="single-form-card">
                    <h2>Create Assignment</h2>

                    <div class="field">
                        <label>SUBJECT NAME</label>
                        <input type="text" id="subjectName" placeholder="Operating Systems">
                    </div>

                    <div class="field">
                        <label>ASSIGNMENT TITLE</label>
                        <input type="text" id="assignmentTitle" placeholder="e.g. CPU Scheduling Algorithms">
                    </div>

                    <div class="field">
                        <label>DUE DATE</label>
                        <input type="date" id="dueDate">
                    </div>

                    <button id="createAssignmentBtn" class="submit-btn">Create Assignment</button>
                    <p id="assignmentMessage" class="message"></p>
                </div>
            </section>
        </main>
    </div>

    <script src="js/teacher-assignment.js"></script>
</body>
</html>
