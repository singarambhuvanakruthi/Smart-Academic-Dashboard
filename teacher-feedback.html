<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Classroom Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/teacher-feedback.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <div class="brand-logo">
                        <i class="ri-graduation-cap-line"></i>
                    </div>
                    <div class="brand-text">Smart Academic</div>
                </div>

                <div class="profile-card">
                    <div class="profile-avatar">
                        <i class="ri-user-3-line"></i>
                        <span class="status-dot"></span>
                    </div>
                    <h2 id="sidebarUserName">Meghana</h2>
                    <p id="sidebarUserRole">Assistant Professor</p>
                    <p id="sidebarUserDept">Dept. of CSE</p>
                </div>

                <nav class="sidebar-menu">
                    <a href="teacher-dashboard.html" class="menu-item">
                        <i class="ri-dashboard-line"></i>
                        <span>Dashboard</span>
                    </a>

                    <a href="teacher-feedback.html" class="menu-item active">
                        <i class="ri-chat-1-line"></i>
                        <span>Classroom Feedback</span>
                    </a>

                    <a href="teacher-assignment.html" class="menu-item">
                        <i class="ri-task-line"></i>
                        <span>Assignment Tracker</span>
                    </a>

                    <a href="teacher-requests.html" class="menu-item">
                        <i class="ri-notification-3-line"></i>
                        <span>Complaint & Request Box</span>
                    </a>
                </nav>
            </div>

            <div class="logout-wrap">
                <button id="logoutBtn" class="logout-btn">
                    <i class="ri-logout-box-r-line"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1>Classroom Feedback</h1>

                <div class="topbar-right">
                    <div class="search-box">
                        <i class="ri-search-line"></i>
                        <input type="text" id="searchInput" placeholder="Search...">
                    </div>

                    <button class="icon-btn">
                        <i class="ri-notification-3-line"></i>
                        <span class="notif-badge" id="notifCount">0</span>
                    </button>

                    <div class="top-user">
                        <div class="top-user-icon">
                            <i class="ri-user-line"></i>
                        </div>
                        <span id="topUserName">Meghana</span>
                    </div>
                </div>
            </header>

            <section class="page-body">
                <div class="feedback-summary-card">
                    <div class="feedback-header">
                        <h2>Student Understanding Summary</h2>
                        <div class="subject-tag" id="subjectTag">TODAY'S FEEDBACK</div>
                    </div>

                    <div class="stats-row">
                        <div class="stat-box">
                            <h3 id="understoodPercent" class="green-text">0%</h3>
                            <p>UNDERSTOOD</p>
                        </div>
                        <div class="stat-box">
                            <h3 id="confusedPercent" class="orange-text">0%</h3>
                            <p>CONFUSED</p>
                        </div>
                        <div class="stat-box">
                            <h3 id="tooFastPercent" class="pink-text">0%</h3>
                            <p>TOO FAST</p>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div id="understoodBar" class="bar green-bar"></div>
                        <div id="confusedBar" class="bar orange-bar"></div>
                        <div id="tooFastBar" class="bar pink-bar"></div>
                    </div>

                    <div class="doubts-section">
                        <div class="section-title">
                            <i class="ri-question-answer-line"></i>
                            <h3>Recent Student Doubts</h3>
                        </div>

                        <div id="doubtsList" class="doubts-grid"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/teacher-feedback.js"></script>
</body>
</html>
